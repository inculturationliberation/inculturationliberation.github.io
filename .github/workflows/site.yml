name: Update Substack articles and publish site
on: {schedule: [{cron: "30 0 * * *"}], push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs: {update-and-deploy: {runs-on: ubuntu-latest, environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}, steps: [{uses: "actions/checkout@v4"}, {name: "Read the Substack feed", run: "python3 scripts/update_substack.py || echo 'Feed not reachable today; keeping the current list.'"}, {name: "Save the new article list", run: "if git diff --quiet; then echo 'No new articles.'; else git config user.name 'substack-update-bot' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git commit -am 'Update latest Substack articles' && git push; fi"}, {name: "Prepare site files", run: "mkdir -p _site && cp index.html _site/ && if [ -f CNAME ]; then cp CNAME _site/; fi"}, {uses: "actions/configure-pages@v5"}, {uses: "actions/upload-pages-artifact@v3", with: {path: _site}}, {id: deployment, uses: "actions/deploy-pages@v4"}]}}
